items:
  - q: "Quel est le meilleur plugin de recettes WordPress ?"
    a: "Pour la plupart des blogs culinaires, WP Recipe Maker. Il a la plus grande base d'utilisateurs, la meilleure note sur wordpress.org, et une version gratuite avec schéma JSON-LD et éditeur de modèles. D'autres plugins conviennent mieux dans des cas précis, comme Create pour le calcul nutritionnel gratuit, Recipe Card Blocks pour plusieurs sites, et WP Delicious ou Plugixa Recipe pour un annuaire de recettes."
  - q: "Quel est le meilleur plugin de recettes si je ne veux pas payer ?"
    a: "Cela dépend de la fonctionnalité dont vous avez le plus besoin. Create offre le calcul nutritionnel automatique. WP Recipe Maker offre un éditeur de modèles et le balisage Guided Recipes. Recipe Card Blocks offre le mode cuisine. Plugixa Recipe offre les soumissions des visiteurs et les avis, mais réserve le JSON-LD à sa version payante."
  - q: "Ai-je besoin d'un plugin de recettes pour que Google affiche mes recettes ?"
    a: "Google lit les données structurées Recipe pour afficher les notes, le temps de cuisson et les images dans les résultats de recherche. Un plugin de recettes écrit ces données pour vous. Google recommande le format JSON-LD, dont nous avons confirmé la gratuité dans cinq des sept plugins présentés ici."
  - q: "Quelle est la différence entre un plugin de fiche recette et un plugin de site de recettes ?"
    a: "Un plugin de fiche recette ajoute une fiche recette dans un article de blog, sous votre propre texte. Un plugin de site de recettes donne à chaque recette sa propre page et construit autour d'elles des listes, des catégories et une recherche. WP Recipe Maker, Tasty Recipes, Create et Recipe Card Blocks sont des plugins de fiche recette. WP Delicious, Cooked et Plugixa Recipe sont plutôt orientés sites de recettes."
  - q: "Puis-je changer de plugin de recettes sans perdre mes recettes ?"
    a: "En général oui, si le nouveau plugin dispose d'un outil d'import pour l'ancien. WP Recipe Maker importe depuis plus de 20 plugins ; Tasty Recipes et Create importent chacun depuis 11. Lancez d'abord l'import sur une copie de préproduction et vérifiez que les notes et les images ont bien été reprises."
  - q: "Quels plugins de recettes calculent automatiquement les valeurs nutritionnelles ?"
    a: "Create le fait gratuitement. WP Recipe Maker, Recipe Card Blocks et Cooked le font dans une formule payante. Tasty Recipes se connecte à Nutrifox, un abonnement distinct. Plugixa Recipe n'a pas de calculateur fondé sur une base de données alimentaire."
  - q: "Qui gère ce comparatif ?"
    a: "Plugixa, la société qui édite Plugixa Recipe. C'est un conflit d'intérêts. Pour le limiter, chaque valeur renvoie à sa source, chaque page de plugin liste les points faibles autant que les points forts, et notre propre plugin n'est classé premier que là où les données le justifient."
  - q: "À quelle fréquence les données sont-elles mises à jour ?"
    a: "Le nombre d'installations, les notes et les numéros de version sont lus chaque semaine via l'API de wordpress.org. Les fonctionnalités et les prix sont vérifiés à la main, et chaque page de plugin affiche la date de la dernière vérification."
