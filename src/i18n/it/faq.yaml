items:
  - q: "Qual è il miglior plugin ricette per WordPress?"
    a: "Per la maggior parte dei blog di cucina, WP Recipe Maker. Ha la base di utenti più ampia, la valutazione più alta su wordpress.org e una versione gratuita con schema JSON-LD ed editor dei template. Altri plugin sono più adatti in casi specifici: Create per il calcolo gratuito dei valori nutrizionali, Recipe Card Blocks per più siti, WP Delicious o Plugixa Recipe per una directory di ricette."
  - q: "Qual è il miglior plugin ricette se non voglio pagare?"
    a: "Dipende dalla funzione che ti serve di più. Create offre gratis il calcolo automatico dei valori nutrizionali. WP Recipe Maker offre gratis un editor dei template e il markup Guided Recipes. Recipe Card Blocks offre gratis la modalità cucina. Plugixa Recipe offre gratis le ricette inviate dai visitatori e le recensioni, ma riserva il JSON-LD alla versione a pagamento."
  - q: "Mi serve un plugin ricette perché Google mostri le mie ricette?"
    a: "Google legge i dati strutturati Recipe per mostrare valutazioni, tempo di cottura e immagini nei risultati di ricerca. Un plugin ricette scrive questi dati al posto tuo. Google consiglia il formato JSON-LD, che abbiamo confermato come gratuito in cinque dei sette plugin presenti qui."
  - q: "Che differenza c'è tra un plugin per schede ricetta e un plugin per siti di ricette?"
    a: "Un plugin per schede aggiunge una scheda ricetta dentro un articolo del blog, sotto il tuo testo. Un plugin per siti di ricette dà a ogni ricetta una pagina propria e ci costruisce attorno elenchi, categorie e ricerca. WP Recipe Maker, Tasty Recipes, Create e Recipe Card Blocks sono plugin per schede. WP Delicious, Cooked e Plugixa Recipe sono più orientati ai siti di ricette."
  - q: "Posso cambiare plugin ricette senza perdere le mie ricette?"
    a: "Di solito sì, se il nuovo plugin ha un importatore per quello vecchio. WP Recipe Maker importa da più di 20 plugin; Tasty Recipes e Create da 11 ciascuno. Esegui prima l'importazione su una copia di staging e controlla che valutazioni e immagini siano state trasferite."
  - q: "Quali plugin ricette calcolano i valori nutrizionali in automatico?"
    a: "Create lo fa gratis. WP Recipe Maker, Recipe Card Blocks e Cooked lo fanno in un livello a pagamento. Tasty Recipes si collega a Nutrifox, un abbonamento separato. Plugixa Recipe non ha un calcolatore basato su un database di alimenti."
  - q: "Chi gestisce questo confronto?"
    a: "Plugixa, l'azienda che sviluppa Plugixa Recipe. È un conflitto di interessi. Per limitarlo, ogni valore rimanda alla sua fonte, la pagina di ogni plugin elenca i punti deboli oltre ai punti di forza e il nostro plugin è al primo posto solo dove i dati lo giustificano."
  - q: "Ogni quanto vengono aggiornati i dati?"
    a: "Il numero di installazioni, le valutazioni e i numeri di versione vengono letti dall'API di wordpress.org ogni settimana. Funzioni e prezzi vengono verificati a mano, e la pagina di ogni plugin mostra la data dell'ultima verifica."
